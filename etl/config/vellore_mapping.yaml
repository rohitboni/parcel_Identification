dataset:
  name: vellore_cad
  source_path: ../data/vellore/vellore_cad.shp
  crs: EPSG:4326
field_mapping:
  STATE: state
  District: district_name
  TEHSIL: sub_district_name
  v_name: village_name
  survey_n_4: survey_num
transforms:
  # Hardcoded values for single state/district dataset
  state_code:
    source: null
    transform: constant
    value: TN #hardcoded value for Tamil Nadu
  district_code:
    source: null
    transform: constant
    value: VELLORE #hardcoded value for Vellore district
required_fields:
- survey_num
- state
- state_code
- district_code
- district_name
geometry:
  # Note: simplify_tolerance is NOT used - we preserve original geometry
  target_crs: EPSG:4326
  compute_label_point: true
notes:
  parcel_uuid: Auto-generated by database (DEFAULT gen_random_uuid()) - no mapping
    needed
  geom: Taken from shapefile geometry column - cleaned and normalized to MultiPolygon (ORIGINAL, not simplified)
  label_point: Computed during ETL using ST_PointOnSurface(geom) - moved from tile
    generation
  simplification: DISABLED - parcels_simplified table contains original geometry (not simplified)
